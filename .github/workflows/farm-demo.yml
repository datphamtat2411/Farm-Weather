name: Farm weather demo CI
on:
  push:
    paths: ['farm-demo/**', '.github/workflows/farm-demo.yml']
  pull_request:
    paths: ['farm-demo/**', '.github/workflows/farm-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: farm-demo-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare evidence directory
        run: |
          mkdir -p farm-demo/evidence
          git rev-parse HEAD > farm-demo/evidence/commit.txt
          python --version > farm-demo/evidence/toolchain.txt
          g++ --version >> farm-demo/evidence/toolchain.txt
      - name: Native logic tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I farm-demo/firmware/include farm-demo/tests/weather_test.cpp -o /tmp/weather-test
          /tmp/weather-test | tee farm-demo/evidence/native.log
          python -m unittest discover -s farm-demo/tests -v 2>&1 | tee farm-demo/evidence/python-tests.log
      - name: Build STM32 firmware
        run: |
          python -m pip install platformio==6.1.18
          pio --version >> farm-demo/evidence/toolchain.txt
          pio run -d farm-demo/firmware 2>&1 | tee farm-demo/evidence/build.log
          pio pkg list -d farm-demo/firmware >> farm-demo/evidence/toolchain.txt
          test -s farm-demo/firmware/.pio/build/bluepill_f103c8/firmware.bin
          test -s farm-demo/firmware/.pio/build/bluepill_f103c8/firmware.elf
          sha256sum farm-demo/firmware/.pio/build/bluepill_f103c8/firmware.{bin,elf} > farm-demo/evidence/firmware-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware
          path: |
            farm-demo/firmware/.pio/build/bluepill_f103c8/firmware.bin
            farm-demo/firmware/.pio/build/bluepill_f103c8/firmware.elf
          if-no-files-found: error
          retention-days: 30
      - name: Install pinned Wokwi CLI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/wokwi-cli" https://github.com/wokwi/wokwi-cli/releases/download/v0.29.1/wokwi-cli-linuxstatic-x64
          echo "3c9d6da007d008a3822ab468318037285440055132c59fd659d7306e40f14258  $RUNNER_TEMP/wokwi-cli" | sha256sum --check
          chmod +x "$RUNNER_TEMP/wokwi-cli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wokwi-cli" --version >> farm-demo/evidence/toolchain.txt
      - name: Lint Wokwi diagram
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: farm-demo/firmware
        run: wokwi-cli lint 2>&1 | tee ../evidence/diagram-lint.log
      - name: Run Wokwi scenario
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: farm-demo/firmware
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: |
          if [ -z "$WOKWI_CLI_TOKEN" ]; then
            echo "::error::Missing WOKWI_CLI_TOKEN (repository Actions secret)."
            exit 1
          fi
          wokwi-cli . --scenario scenarios/weather.yaml --timeout 60000 --serial-log-file ../evidence/serial.log 2>&1 | tee ../evidence/wokwi.log
      - name: Verify telemetry and persistent SQLite idempotency
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python farm-demo/tests/verify_smoke.py farm-demo/evidence/serial.log farm-demo/evidence/weather.sqlite | tee farm-demo/evidence/smoke.json
      - name: Report fork limitation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo 'External fork: build/native tests only; Wokwi simulation NOT VERIFIED (no secret access).' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: farm-demo-evidence
          path: farm-demo/evidence/
          if-no-files-found: warn
          retention-days: 30
