[platformio]
default_envs = bluepill_f103c8

[env]
platform = ststm32@20.0.0
framework = arduino
platform_packages =
    platformio/framework-arduinoststm32@4.30000.0
    platformio/toolchain-gccarmnoneeabi@1.120301.0
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17

[env:bluepill_f103c8]
board = bluepill_f103c8
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DFARM_WOKWI_SIMULATION=1

; Compile/link the common logic and report pin contract, NOT deployable firmware.
[env:nucleo_l476rg]
board = nucleo_l476rg
build_src_filter = +<physical_compile_probe.cpp>
build_flags = ${env.build_flags} -DFARM_PHYSICAL_COMPILE_PROBE=1
