name: Weather station hardware and foundation smoke
version: 1
steps:
  - wait-serial: 'READY FARM_WS_01 SIMULATION'
  - set-control:
      part-id: wind
      name: frequency
      value: 3
  - set-control:
      part-id: ambient
      name: temperature
      value: 27.5
  - set-control:
      part-id: ambient
      name: humidity
      value: 65
  - set-control:
      part-id: ambient
      name: pressure
      value: 1012
  - set-control:
      part-id: direction
      name: position
      value: 0.1803
  - set-control:
      part-id: battery
      name: position
      value: 0.505
  - delay: 200ms
  - expect-pin:
      part-id: mcu
      name: B8
      value: 0
  - expect-pin:
      part-id: mcu
      name: B9
      value: 0
  - set-control:
      part-id: wind
      name: frequency
      value: 27
  - wait-serial: 'WIND_ALARM_ON'
  - delay: 12ms
  - expect-pin:
      part-id: mcu
      name: B8
      value: 1
  - expect-pin:
      part-id: mcu
      name: B9
      value: 1
  - set-control:
      part-id: rain
      name: pressed
      value: 1
  - wait-serial: 'RAIN_TIPS=1'
  - delay: 60ms
  - set-control:
      part-id: rain
      name: pressed
      value: 0
  - set-control:
      part-id: wind
      name: frequency
      value: 3
  - wait-serial: 'WIND_ALARM_OFF'
  - delay: 60ms
  - expect-pin:
      part-id: mcu
      name: B8
      value: 0
  - expect-pin:
      part-id: mcu
      name: B9
      value: 0
  - wait-serial: 'TELEMETRY'
  - delay: 600ms
